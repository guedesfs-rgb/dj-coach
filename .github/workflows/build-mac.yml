name: Build Mac app

on:
  push:
    branches: [main, prototipo-1]
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-14 # Apple Silicon (M1)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: DJ-Coach-mac
          path: dist/*.dmg
